<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>من جود إلى سيموا - تحفة فنية متكاملة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #150015 0%, #050005 60%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overscroll-behavior: none;
        }

        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* الحاوية الرئيسية للقلب - تم تصغيرها قليلاً لتناسب الموبايل بالكامل */
        .container {
            position: relative;
            width: min(420px, 85vw);
            height: min(380px, 50vh);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الوردة الفردية المتحركة */
        .rose-particle {
            position: absolute;
            --rose-size: min(12px, 3.5vw);
            width: var(--rose-size);
            height: var(--rose-size);
            background: radial-gradient(circle, #ff3366 20%, #990022 90%);
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3366, 0 0 15px #ff1a40;
            opacity: 0;
            pointer-events: none;
            
            offset-path: path('M 275,90 C 275,40 190,-10 130,-10 C 40,-10 -20,80 -20,160 C -20,260 90,340 275,470 C 460,340 570,260 570,160 C 570,80 510,-10 420,-10 C 360,-10 275,40 275,90 Z');
            
            animation: travelAndStay 3.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes travelAndStay {
            0% {
                offset-distance: 0%;
                opacity: 0;
                transform: scale(0.1);
            }
            5% {
                opacity: 1;
                transform: scale(1.2);
            }
            95% {
                opacity: 1;
            }
            100% {
                offset-distance: var(--final-pos);
                opacity: 1;
                transform: scale(1);
            }
        }

        /* التوهج الخلفي */
        .heart-glow {
            position: absolute;
            width: min(320px, 65vw);
            height: min(320px, 65vw);
            background: radial-gradient(circle, rgba(255, 51, 102, 0.4) 0%, rgba(255, 0, 85, 0.1) 50%, rgba(0, 0, 0, 0) 80%);
            opacity: 0;
            z-index: 1;
            border-radius: 50%;
            animation: showGlow 1.2s ease 4.2s forwards, pulseGlow 2.5s infinite ease-in-out 5.4s;
        }

        @keyframes showGlow {
            to { opacity: 1; }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 20px rgba(255,51,102,0.8)); }
        }

        /* النصوص */
        .signature-wrapper {
            position: relative;
            z-index: 3;
            margin-top: 15px;
            text-align: center;
            padding: 0 10px;
            opacity: 0;
            transform: translateY(30px);
            animation: revealText 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 4.5s forwards;
        }

        .signature-text {
            font-size: clamp(1.2rem, 4.5vw, 2.2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ff99bb, #ff1a40, #ff99bb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
            letter-spacing: 1px;
            line-height: 1.3;
        }

        .sub-text {
            font-size: clamp(0.8rem, 2.2vw, 1.1rem);
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 3px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        @keyframes revealText {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        canvas#fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }
        
        @media (hover: none) {
            .stage {
                transition: none;
                transform: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="stars-bg" id="starsContainer"></div>
    <canvas id="fireworks"></canvas>

    <div class="stage" id="stage">
        <div class="container" id="heartContainer">
            <div class="heart-glow"></div>
        </div>
    </div>

    <div class="signature-wrapper">
        <div class="signature-text">هذا مني إلى من عشقتها عيوني</div>
        <div class="sub-text">Forever Love</div>
    </div>

    <script>
        const starsContainer = document.getElementById('starsContainer');
        const numStars = window.innerWidth < 768 ? 40 : 80;
        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            const duration = Math.random() * 3 + 2;
            
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', duration + 's');
            star.style.animationDelay = Math.random() * 5 + 's';
            
            starsContainer.appendChild(star);
        }

        const stage = document.getElementById('stage');
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth >= 768) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 30;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 30;
                stage.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const xAxis = (window.innerWidth / 2 - touch.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - touch.pageY) / 50;
                stage.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });
        
        document.addEventListener('touchend', () => { stage.style.transform = 'rotateY(0deg) rotateX(0deg)'; });

        const container = document.getElementById('heartContainer');
        const totalRoses = 220;
        let currentIndex = 0;

        function createRose() {
            if (currentIndex > totalRoses) {
                setTimeout(startFireworks, 200);
                return;
            }
            const rose = document.createElement('div');
            rose.classList.add('rose-particle');
            const finalPosition = (currentIndex / totalRoses) * 100;
            rose.style.setProperty('--final-pos', finalPosition + '%');
            container.appendChild(rose);
            currentIndex++;
            if (currentIndex <= totalRoses) { setTimeout(createRose, 18); }
        }
        setTimeout(createRose, 500);

        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * (window.innerWidth < 768 ? 4 : 6) + 2;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.alpha = 1; this.decay = Math.random() * 0.015 + 0.010;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.08; this.alpha -= this.decay; }
            draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, window.innerWidth < 768 ? 2 : 3, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        }

        function explode(x, y) {
            const colors = ['#ff3366', '#ff99bb', '#ff1a40', '#ffffff', '#ffcc00'];
            const count = window.innerWidth < 768 ? 25 : 40;
            for (let i = 0; i < count; i++) { particles.push(new FireworkParticle(x, y, colors[Math.floor(Math.random() * colors.length)])); }
        }

        function startFireworks() {
            const interval = setInterval(() => {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * (window.innerHeight / 1.5);
                explode(x, y);
            }, 600);
            setTimeout(() => clearInterval(interval), 6000);
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => { p.update(); p.draw(); if (p.alpha <= 0) { particles.splice(index, 1); } });
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
