<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>من جود إلى سيموا - تحفة فنية متكاملة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: radial-gradient(circle at center, #150015 0%, #050005 60%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1000px;
        }

        /* خلفية النجوم المتلألئة */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* حاوية المشهد مع تأثير ثلاثي الأبعاد تفاعلي */
        .stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            transform-style: preserve-style;
            transition: transform 0.1s ease-out;
        }

        .container {
            position: relative;
            width: 480px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الوردة الفردية المتراكمة */
        .rose-particle {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #ff3366 20%, #990022 90%);
            border-radius: 50%;
            box-shadow: 0 0 12px #ff3366, 0 0 20px #ff1a40;
            opacity: 0;
            pointer-events: none;
            offset-path: path('M 240,110 C 240,55 170,10 115,10 C 40,10 0,75 0,140 C 0,230 100,300 240,400 C 380,300 480,230 480,140 C 480,75 440,10 365,10 C 310,10 240,55 240,110 Z');
            animation: travelAndStay 3.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes travelAndStay {
            0% {
                offset-distance: 0%;
                opacity: 0;
                transform: scale(0.1);
            }
            5% {
                opacity: 1;
                transform: scale(1.2);
            }
            95% {
                opacity: 1;
            }
            100% {
                offset-distance: var(--final-pos);
                opacity: 1;
                transform: scale(1);
            }
        }

        /* توهج خلف القلب مع نبض مستمر */
        .heart-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255, 51, 102, 0.35) 0%, rgba(255, 0, 85, 0.05) 50%, rgba(0, 0, 0, 0) 80%);
            opacity: 0;
            z-index: 1;
            border-radius: 50%;
            animation: showGlow 1.2s ease 4.2s forwards, pulseGlow 2.5s infinite ease-in-out 5.4s;
        }

        @keyframes showGlow {
            to { opacity: 1; }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 30px rgba(255,51,102,0.8)); }
        }

        /* النص الاحترافي المتحرك تحت القلب */
        .signature-wrapper {
            position: relative;
            z-index: 3;
            margin-top: 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: revealText 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 4.5s forwards;
        }

        .signature-text {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff99bb, #ff1a40, #ff99bb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(255, 51, 102, 0.6);
            letter-spacing: 3px;
        }

        .sub-text {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 6px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        @keyframes revealText {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* تأثير الألعاب النارية المتفجرة عبر Canvas */
        canvas#fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }
    </style>
</head>
<body>

    <!-- خلفية النجوم المتحركة -->
    <div class="stars-bg" id="starsContainer"></div>

    <!-- طبقة الألعاب النارية -->
    <canvas id="fireworks"></canvas>

    <!-- مسرح العرض الحركي التفاعلي -->
    <div class="stage" id="stage">
        <div class="container" id="heartContainer">
            <div class="heart-glow"></div>
        </div>
    </div>

    <!-- النص الاحترافي -->
    <div class="signature-wrapper">
        <div class="signature-text">هذا مني إلى من عشقتها عيوني </div>
        <div class="sub-text">Forever Love</div>
    </div>

    <script>
        // 1. توليد النجوم الخلفية
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 70; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            const duration = Math.random() * 3 + 2;
            
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', duration + 's');
            star.style.animationDelay = Math.random() * 5 + 's';
            
            starsContainer.appendChild(star);
        }

        // 2. تتبع حركة الماوس لإعطاء تأثير 3D عميق للمشهد
        const stage = document.getElementById('stage');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            stage.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // 3. رسم وتكوين القلب بالورود المتراكمة
        const container = document.getElementById('heartContainer');
        const totalRoses = 220;
        let currentIndex = 0;

        function createRose() {
            if (currentIndex > totalRoses) {
                // تشغيل الألعاب النارية فور اكتمال القلب تماماً
                setTimeout(startFireworks, 200);
                return;
            }

            const rose = document.createElement('div');
            rose.classList.add('rose-particle');
            
            const finalPosition = (currentIndex / totalRoses) * 100;
            rose.style.setProperty('--final-pos', finalPosition + '%');

            container.appendChild(rose);
            currentIndex++;

            if (currentIndex <= totalRoses) {
                setTimeout(createRose, 18);
            }
        }

        setTimeout(createRose, 500);

        // 4. نظام الألعاب النارية (Fireworks Engine) عند اكتمال القلب
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.010;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.08; // الجاذبية
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function explode(x, y) {
            const colors = ['#ff3366', '#ff99bb', '#ff1a40', '#ffffff', '#ffcc00'];
            for (let i = 0; i < 40; i++) {
                particles.push(new FireworkParticle(x, y, colors[Math.floor(Math.random() * colors.length)]));
            }
        }

        function startFireworks() {
            // إطلاق عدة ألعاب نارية متسلسلة حول الشاشة
            const interval = setInterval(() => {
                const x = Math.random() * (window.innerWidth - 200) + 100;
                const y = Math.random() * (window.innerHeight / 2);
                explode(x, y);
            }, 600);

            // إيقاف الإنشاء التلقائي بعد مدة
            setTimeout(() => clearInterval(interval), 6000);
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
